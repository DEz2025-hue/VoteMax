services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: votemax
      POSTGRES_PASSWORD: votemax_dev_only
      POSTGRES_DB: votemax
    ports:
      - "5432:5432"
    volumes:
      - votemax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votemax -d votemax"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  votemax_pg:
